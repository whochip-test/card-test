<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>会員証テスト</title>
<style>
  :root { --bg: #f4f6f3; --card: #ffffff; --ink: #1d2420; --muted: #5d6a62; --line: #d9dfda; --accent: #0b7a4b; --warn: #a24a12; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
  main { max-width: 440px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-left)) 32px; }
  h1 { font-size: 18px; margin: 0 0 12px; letter-spacing: .04em; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .muted { color: var(--muted); font-size: 14px; }
  .warn { color: var(--warn); }
  ul { padding-left: 1.2em; margin: 8px 0 16px; }
  button { appearance: none; border: 0; border-radius: 10px; padding: 14px 16px; font: inherit; font-weight: 700; width: 100%; background: var(--accent); color: #fff; }
  button.sub { background: transparent; color: var(--muted); font-weight: 400; padding: 10px; text-decoration: underline; }
  .qr { display: grid; place-items: center; padding: 16px; background: #fff; border-radius: 10px; }
  .qr svg { width: 100%; max-width: 280px; height: auto; }
  .name { font-size: 20px; font-weight: 700; text-align: center; margin: 4px 0 0; }
  .row { display: grid; gap: 8px; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <h1>会員証テスト</h1>
  <div id="app" class="card"><p class="muted">読み込んでいます…</p></div>
</main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="./config.js"></script>
<script>
const CFG = window.APP_CONFIG || {};
const CONSENT_VERSION = 'v1';
const app = document.getElementById('app');
let idToken = null, confirmingWithdraw = false;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
async function api(body) {
  const r = await fetch(CFG.GAS_URL, { method: 'POST', body: JSON.stringify(body) });   // text/plain で送る（GASの受け口は事前確認のない形だけ受けられる）
  return r.json();
}
function qrSvg(text) { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 6, margin: 2, scalable: true }); }

function render(s) {
  if (s.error) {
    app.innerHTML = `<p class="warn">${esc(s.message || s.error)}</p><div class="row"><button onclick="location.reload()">開き直す</button></div>`;
    return;
  }
  if (['no_consent', 'withdrawn', 'reconsent_required'].includes(s.state)) {
    app.innerHTML = `
      ${s.message ? `<p class="warn">${esc(s.message)}</p>` : ''}
      <p><b>会員証の利用について（テスト）</b></p>
      <p class="muted">これは社内の動作確認用の試作です。</p>
      <ul class="muted">
        <li>使う情報：LINEのユーザーID（会員証と来店の記録を結ぶため）</li>
        <li>使い方：拠点の受付で会員証のQRを読み取り、来店の日時を記録します。来店を担当者に知らせる文面を作ります（テストでは実際の担当者には送りません）</li>
        <li>テストの記録は、確認が終わったら消します</li>
      </ul>
      <div class="row"><button id="agree">同意して会員証を表示する</button></div>`;
    document.getElementById('agree').onclick = async () => {
      app.innerHTML = '<p class="muted">登録しています…</p>';
      render(await api({ action: 'consent', idToken, agreed: true, version: CONSENT_VERSION }));
    };
    return;
  }
  if (s.qr) {
    const lead = s.state === 'active' ? '受付でこのQRを見せてください。' : '初回は、受付でスタッフが本人を確認します。このQRを見せてください。';
    app.innerHTML = `
      <div class="qr">${qrSvg(s.qr)}</div>
      ${s.name ? `<p class="name">${esc(s.name)} さん</p>` : ''}
      <p class="muted" style="text-align:center">${esc(lead)}</p>
      <div class="row">
        <button id="refresh">表示を更新</button>
        <button class="sub" id="withdraw">${confirmingWithdraw ? 'もう一度押すと同意を取り消します' : '同意を取り消す'}</button>
      </div>`;
    document.getElementById('refresh').onclick = start;
    document.getElementById('withdraw').onclick = async () => {
      if (!confirmingWithdraw) { confirmingWithdraw = true; render(s); return; }
      confirmingWithdraw = false;
      app.innerHTML = '<p class="muted">取り消しています…</p>';
      render(await api({ action: 'withdraw', idToken }));
    };
    return;
  }
  app.innerHTML = `<p class="warn">${esc(s.message || '会員証は使えません。受付でお声がけください')}</p><div class="row"><button onclick="location.reload()">開き直す</button></div>`;
}

async function start() {
  try {
    if (!CFG.LIFF_ID || !CFG.GAS_URL) throw new Error('config.js の LIFF_ID と GAS_URL を入れてください');
    await liff.init({ liffId: CFG.LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    idToken = liff.getIDToken();
    if (!idToken) throw new Error('LINEのIDトークンを取得できません（チャネルの scope に openid が必要です）');
    app.innerHTML = '<p class="muted">確認しています…</p>';
    render(await api({ action: 'status', idToken }));
  } catch (e) {
    render({ error: 'ERROR', message: e.message || String(e) });
  }
}
start();
</script>
</body>
</html>
